<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blaze Form Tracker - Leader</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Leader view</h1>

  <form id="loginForm">
    <label for="emailInput">Email</label>
    <input id="emailInput" type="email" autocomplete="username" required>
    <label for="passwordInput">Password</label>
    <input id="passwordInput" type="password" autocomplete="current-password" required>
    <button type="submit">Log in</button>
  </form>

  <p id="message"></p>

  <div id="results" hidden>
    <button id="logoutBtn">Log out</button>
    <p class="note">Workouts are deleted automatically after 3 days.</p>
    <div id="dayList"></div>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
