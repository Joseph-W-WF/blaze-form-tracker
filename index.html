<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blaze Form Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Blaze Form Tracker</h1>
  <button id="startBtn">Start camera</button>
  <p id="status">Click start when ready.</p>

  <div id="stage">
    <video id="webcam" playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>

  <!-- Live numbers (kept outside the mirrored canvas so text isn't backwards) -->
  <div id="stats">
    <p>Knee angle: <span id="angleText">--</span></p>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
